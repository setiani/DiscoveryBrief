[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "discoverybrief"
version = "0.1.0"
description = "Evidence-based enterprise meeting preparation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "httpx>=0.27,<1", "jinja2>=3.1,<4", "typer>=0.12,<1", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
pdf = ["playwright>=1.50,<2", "pypdf>=5,<7"]

[project.scripts]
discoverybrief = "discoverybrief.cli:app"

[tool.setuptools.package-data]
discoverybrief = ["agents/prompts/*.md"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
markers = ["live: requires explicit live enablement and credentials", "slow: browser or PDF tests"]

[tool.ruff]
extend-exclude = ["data", "web/node_modules", "web/dist", ".venv", "backend/*.egg-info"]

